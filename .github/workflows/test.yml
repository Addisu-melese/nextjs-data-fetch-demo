name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Start mock API
        run: |
          node server.js > /tmp/json-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/users > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/json-server.log
          exit 1

      - name: Build
        run: npm run build
